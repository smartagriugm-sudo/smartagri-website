name: Import WordPress news

# Pulls new posts from the old WordPress site into Field Notes (converting
# images to WebP and HTML to Markdown) and commits them, which triggers a
# Vercel deploy. Near-real-time runs come from the WordPress publish webhook
# (repository_dispatch); the schedule is a safety-net poll in case a webhook
# is missed. See SETUP-NEWS-SYNC.md for the webhook setup.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      retranslate:
        description: "Re-import and re-translate ALL posts (needs ANTHROPIC_API_KEY)"
        type: boolean
        default: false
  repository_dispatch:
    types: [wp-publish]

permissions:
  contents: write

# Never let two import runs race on a push to main.
concurrency:
  group: import-wp-news
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Import new posts
        working-directory: web
        # English translation backends (both optional). Set the TRANSLATE_OLLAMA_*
        # repo secrets/vars to translate via the on-prem Ollama server (free), or
        # ANTHROPIC_API_KEY to use the Anthropic API. Without either, posts are
        # imported in Indonesian.
        env:
          TRANSLATE_OLLAMA_URL: ${{ secrets.TRANSLATE_OLLAMA_URL }}
          TRANSLATE_OLLAMA_KEY: ${{ secrets.TRANSLATE_OLLAMA_KEY }}
          TRANSLATE_OLLAMA_MODEL: ${{ vars.TRANSLATE_OLLAMA_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RETRANSLATE: ${{ inputs.retranslate }}
        run: node scripts/import-wp.mjs

      - name: Commit and push if there are new posts
        run: |
          if [ -n "$(git status --porcelain web/src/content/notes web/public/brand/uploads/notes)" ]; then
            git config user.name "smartagri-news-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add web/src/content/notes web/public/brand/uploads/notes
            git commit -m "Import latest news from the old site"
            git push
          else
            echo "No new posts to import."
          fi
