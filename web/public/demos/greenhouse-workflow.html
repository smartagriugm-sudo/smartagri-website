<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Greenhouse Workflow Simulator</title>
  <style>html,body{margin:0;background:#062A32}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></head>
<body>
<!-- Smart Greenhouse — combined workflow simulator (Agent / Linear) -->
<div id="app">
  <div class="topbar">
    <div class="left">
      <div class="brand">Smart Greenhouse &middot; <span>Workflow Simulator</span></div>
      <div class="viewtoggle">
        <button class="vbtn active" data-v="agent">Agent</button>
        <button class="vbtn" data-v="linear">Linear</button>
      </div>
    </div>
    <div class="controls">
      <button id="prevBtn" class="btn">&#9664;</button>
      <button id="playBtn" class="btn primary">&#9208; Pause</button>
      <button id="nextBtn" class="btn">&#9654;</button>
      <button id="restartBtn" class="btn">&#8634; Restart</button>
      <div class="speed"><span>Speed</span>
        <button class="btn sp" data-s="0.5">0.5x</button>
        <button class="btn sp active" data-s="1">1x</button>
        <button class="btn sp" data-s="2">2x</button>
      </div>
    </div>
  </div>

  <div class="readout">
    <div class="sc-title"><span class="sc-no" id="scNo">1/8</span><span id="scTitle">&mdash;</span></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="stagewrap">
    <div class="stage" id="stage"></div>
    <div class="zoomctl">
      <button class="zbtn" id="zoomOut" title="Zoom out" aria-label="Zoom out">&#8722;</button>
      <button class="zbtn zlabel" id="zoomReset" title="Reset zoom">Fit</button>
      <button class="zbtn" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
    </div>
  </div>

  <div class="caption"><div class="step" id="phase">read sensors</div><div id="capText" class="captext">Starting&hellip;</div></div>
</div>

      <defs>

      chips:[["Temp","33°C ▲","warn"],["RH","58%","ok"],["VPD","2.1 kPa ▲","warn"],["DLI","13","ok"],["CO₂","720 ppm","ok"],["Substrate","60%","ok"]],
      focus:"n_climate", bubble:"33°C · VPD 2.1",
      decide:"The Decision Model finds temperature 33°C and VPD 2.1 kPa above setpoint (≤28°C, ≤1.5 kPa), so it selects the T / VPD high branch.",
      swPath:"p_sw_cooling", act:"n_cooling", mergePath:"p_cool_merge",
      actMsg:"Cooling runs - exhaust fans, cooling pad, and fogging lower the temperature and raise humidity." },

    { title:"Cloudy, low light",
      chips:[["Temp","25°C","ok"],["RH","70%","ok"],["PPFD","180 µmol ▼","warn"],["DLI","7 / 14 ▼","warn"],["CO₂","700 ppm","ok"],["Substrate","58%","ok"]],
      focus:"n_light", bubble:"DLI 7 / 14",
      decide:"The Decision Model sees accumulated light at only 7 of the 14 mol·m⁻²·d⁻¹ target, so it selects the light low branch.",
      swPath:"p_sw_lights", act:"n_lights", mergePath:"p_lights_merge",
      actMsg:"Grow Lights run - supplemental LEDs switch on and the shade screen opens to raise the daily light integral." },

    { title:"Substrate drying out",
      chips:[["Temp","27°C","ok"],["RH","62%","ok"],["Substrate","34% ▼","warn"],["EC","1.2 mS/cm ▼","warn"],["pH","6.1","ok"],["DLI","12","ok"]],
      focus:"n_substrate", bubble:"34% · EC 1.2",
      decide:"The Decision Model finds substrate moisture at 34% (below the 50% threshold) and EC low at 1.2 mS/cm, so it selects the substrate off branch.",
      swPath:"p_sw_fert", act:"n_fert", mergePath:"p_fert_merge",
      actMsg:"Fertigation runs - the dosing pump and valve deliver nutrient solution through drip lines to the root zone." },

    { title:"Night, temperature drop",
      chips:[["Temp","16°C ▼","warn"],["RH","82% ▲","warn"],["VPD","0.4 kPa ▼","warn"],["DLI","0 (night)","ok"],["CO₂","650 ppm","ok"],["Substrate","57%","ok"]],
      focus:"n_climate", bubble:"16°C low",
      decide:"The Decision Model finds temperature 16°C below the 18°C minimum, so it selects the T low branch.",
      swPath:"p_sw_heating", act:"n_heating", mergePath:"p_heat_merge",
      actMsg:"Heating runs - the heater/HVAC warms the space and vents close to retain heat." },

    { title:"Low CO₂ at peak photosynthesis",
      chips:[["Temp","26°C","ok"],["DLI","15","ok"],["CO₂","380 ppm ▼","warn"],["RH","65%","ok"],["Substrate","59%","ok"]],
      focus:"n_climate", bubble:"CO₂ 380 ppm",
      decide:"The Decision Model sees ample light but CO₂ at 380 ppm, far below the ~800 ppm target, so it selects the CO₂ low branch.",
      swPath:"p_sw_co2", act:"n_co2", mergePath:"p_co2_merge",
      actMsg:"CO₂ Enrichment runs - the injection valve opens to raise CO₂ and boost photosynthesis." },

    { title:"All parameters optimal",
      chips:[["Temp","24°C","ok"],["RH","68%","ok"],["VPD","1.1 kPa","ok"],["DLI","14","ok"],["CO₂","800 ppm","ok"],["Substrate","55%","ok"]],
      focus:null, bubble:null,
      decide:"The Decision Model finds every parameter within its setpoint range, so it selects the optimal branch.",
      swPath:"p_sw_maintain", act:"n_maintain", mergePath:"p_maintain_merge",
      actMsg:"Maintain - conditions are held; only status and dashboard are updated." },

    { title:"Peak midday load (multi-condition)", multi:true, warn:true,
      chips:[["Temp","32°C ▲","warn"],["VPD","1.9 kPa ▲","warn"],["Substrate","38% ▼","warn"],["EC","1.1 mS/cm ▼","warn"],["CO₂","420 ppm ▼","warn"],["DLI","16","ok"]],
      focusList:["n_climate","n_substrate"],
      bubbles:[{node:"n_climate",text:"32°C · VPD 1.9"},{node:"n_substrate",text:"38% · EC 1.1"}],
      decide:"The Decision Model finds three conditions at once: high temp/VPD, dry substrate, and low CO₂. With the Switch in all-matching mode, several branches fire together.",
      branches:[{sw:"p_sw_cooling",act:"n_cooling",merge:"p_cool_merge"},{sw:"p_sw_fert",act:"n_fert",merge:"p_fert_merge"},{sw:"p_sw_co2",act:"n_co2",merge:"p_co2_merge"}],
      actMsg:"Cooling, Fertigation, and CO₂ Enrichment run in parallel. The three actions are combined at Merge, then a single consolidated record is written to Log to DB." },

    { title:"Critical anomaly",
      chips:[["Temp","47°C ⚠","crit"],["RH sensor","ERROR ⚠","crit"],["Fertigation pump","FAILED ⚠","crit"],["DLI","-","crit"]],
      focus:"n_climate", bubble:"47°C ⚠ sensor error", warn:true,
      decide:"The Decision Model detects implausible readings (47°C, sensor error, pump failure), so it selects the anomaly branch.",
      swPath:"p_sw_anomaly", anomaly:true,
      actMsg:"Safe Mode secures the system, then Send Alert (Telegram/email) is dispatched and the event is written to Log to DB." }
  ];

  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function gate(){ while(paused){ await sleep(80);} }
  function clearActive(){ document.querySelectorAll(".node.active").forEach(n=>n.classList.remove("active")); }
  function setActive(ids){ clearActive(); ids.filter(Boolean).forEach(id=>{const e=$(id); if(e)e.classList.add("active");}); }

  function showBubble(nodeId,text,warn){
    const node=$(nodeId); if(!node) return; const card=node.querySelector(".card"); if(!card) return;
    const b=card.getBBox();
    const cx=b.x+b.width/2, top=b.y, w=Math.max(64,text.length*6.6+18), h=22, x=cx-w/2, y=top-h-8;
    const g=document.createElementNS(NS,"g");
    const r=document.createElementNS(NS,"rect");
    r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);r.setAttribute("rx",6);
    r.setAttribute("fill","#24262b");r.setAttribute("stroke",warn?"#ff7b72":"#ffb24a");r.setAttribute("stroke-width","1.4");
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",cx);t.setAttribute("y",y+15);t.setAttribute("text-anchor","middle");t.setAttribute("font-size","12");t.setAttribute("fill",warn?"#ff9a93":"#ffce8a");t.textContent=text;
    g.appendChild(r);g.appendChild(t); if(bub) bub.appendChild(g);
  }

  function animatePacket(pathId,opt){
    opt=opt||{}; const dur=opt.dur||1100, rev=!!opt.rev, warn=!!opt.warn, delay=opt.delay||0;
    return new Promise(async res=>{
      if(delay) await sleep(delay/speed);
      const path=$(pathId); if(!path||!pk) return res();
      const L=path.getTotalLength();
      const dot=document.createElementNS(NS,"circle");
      dot.setAttribute("r","5.5");dot.setAttribute("fill",warn?"#ffb24a":"#45DFB1");dot.setAttribute("filter","url(#glow)");
      pk.appendChild(dot); path.classList.add("flowing"); if(warn) path.classList.add("warn");
      const t0=performance.now(), D=dur/speed;
      function frame(t){
        let p=Math.min(1,(t-t0)/D); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
        const pt=path.getPointAtLength((rev?(1-e):e)*L);
        dot.setAttribute("cx",pt.x);dot.setAttribute("cy",pt.y);
        if(p<1)requestAnimationFrame(frame); else{dot.remove();path.classList.remove("flowing","warn");res();}
      } requestAnimationFrame(frame);
    });
  }

  function setChips(sc){ chipsEl.innerHTML=""; sc.chips.forEach(c=>{const k=c[0],v=c[1],s=c[2];const el=document.createElement("span");el.className="chip "+(s==="ok"?"ok":s==="crit"?"crit":"warn");el.textContent=k+": "+v;chipsEl.appendChild(el);}); }

  async function runScenario(sc,gen){
    const w=!!sc.warn;
    const focusList = sc.multi ? (sc.focusList||[]) : (sc.focus?[sc.focus]:[]);
    scNo.textContent=(idx+1)+"/"+scen.length; scTitle.textContent=sc.title; setChips(sc);

    // PHASE 1 - read sensors
    phase.textContent="1 - read sensors";
    if(view==="agent"){
      capText.textContent="Scenario: "+sc.title+". The Schedule Trigger fires; the Greenhouse Agent reads the current sensor values.";
      setActive(["n_trigger","n_agent"].concat(focusList));
    } else {
      capText.textContent="Scenario: "+sc.title+". The Schedule Trigger fires; the Read Sensors node acquires the current sensor values.";
      setActive(["n_trigger","n_readsensors"].concat(focusList));
    }
    if(sc.multi&&sc.bubbles) sc.bubbles.forEach(b=>showBubble(b.node,b.text,true));
    else if(sc.bubble) showBubble(sc.focus,sc.bubble,w);
    await animatePacket(view==="agent"?"p_trig_agent":"p_trig_read",{dur:800});
    if(gen!==generation)return;
    const reads=focusList.length?focusList:["n_climate","n_substrate","n_light","n_weather"];
    const rev=(view==="agent");
    await Promise.all(reads.map((n,i)=>animatePacket(maps[view][n],{rev:rev,warn:w&&focusList.indexOf(n)>=0,dur:1000,delay:i*70})));
    if(gen!==generation)return; await sleep(400/speed);

    // PHASE 2 - decision (after reading)
    phase.textContent="2 - decision";
    if(view==="agent"){
      capText.textContent="With the readings in hand, the Agent consults its Decision Model to evaluate them against setpoints. "+sc.decide;
      setActive(["n_agent","n_model"].concat(focusList));
      await Promise.all([animatePacket("d_model",{rev:true,dur:900,warn:w}),animatePacket("d_memory",{rev:true,dur:900,delay:120})]);
    } else {
      capText.textContent="Only after the readings are complete does the Decision Model evaluate them against setpoints from the Time-series DB. "+sc.decide;
      setActive(["n_readsensors","n_model","n_db"]);
      await Promise.all([animatePacket("p_read_model",{dur:800,warn:w}),animatePacket("p_db_model",{dur:800,delay:120})]);
    }
    if(gen!==generation)return; await sleep(450/speed);

    // PHASE 3 - routing (Switch)
    phase.textContent="3 - routing (Switch)";
    if(view==="linear"){ setActive(["n_model","n_switch"]); await animatePacket("p_model_switch",{dur:700,warn:w}); }
    else { setActive(["n_agent","n_switch"]); await animatePacket("p_agent_switch",{dur:700,warn:w}); }
    if(gen!==generation)return;
    if(sc.anomaly){
      capText.textContent="The Switch routes to the emergency path - Safe Mode.";
      setActive(["n_switch","n_safemode"]); await animatePacket(sc.swPath,{dur:1100,warn:true});
    } else if(sc.multi){
      capText.textContent="The Switch (all-matching mode) activates several actuator branches at once.";
      setActive(["n_switch"].concat(sc.branches.map(b=>b.act))); await Promise.all(sc.branches.map((b,i)=>animatePacket(b.sw,{dur:1100,delay:i*120})));
    } else {
      capText.textContent="The Switch executes the decision by routing to the matching actuator.";
      setActive(["n_switch",sc.act]); await animatePacket(sc.swPath,{dur:1100});
    }
    if(gen!==generation)return; await sleep(350/speed);

    // PHASE 4 - act + log
    phase.textContent="4 - act + log";
    capText.textContent=sc.actMsg;
    if(sc.anomaly){
      setActive(["n_safemode","n_alert","n_log"]);
      await Promise.all([animatePacket("p_safe_alert",{dur:900,warn:true}),animatePacket("p_safe_log",{dur:1300,warn:true,delay:150})]);
      await animatePacket("p_alert_plus",{dur:400,warn:true});
    } else if(sc.multi){
      setActive(sc.branches.map(b=>b.act).concat(["n_merge"]));
      await Promise.all(sc.branches.map((b,i)=>animatePacket(b.merge,{dur:1000,delay:i*110})));
      if(gen!==generation)return;
      setActive(["n_merge","n_log"]); await animatePacket("p_merge_log",{dur:700}); await animatePacket("p_log_plus",{dur:400});
    } else {
      setActive([sc.act,"n_merge"]); await animatePacket(sc.mergePath,{dur:1000});
      if(gen!==generation)return;
      setActive(["n_merge","n_log"]); await animatePacket("p_merge_log",{dur:700}); await animatePacket("p_log_plus",{dur:400});
    }
    if(gen!==generation)return; await sleep(1100/speed); if(bub) bub.innerHTML="";
  }

  async function loop(){ const gen=++generation; while(gen===generation){ await gate(); await runScenario(scen[idx],gen); if(gen!==generation)return; idx=(idx+1)%scen.length; } }
  function restartLoop(){ if(pk)pk.innerHTML=""; if(bub)bub.innerHTML=""; document.querySelectorAll(".flowing").forEach(p=>p.classList.remove("flowing","warn")); loop(); }

  function renderView(v){
    view=v;
    stage.innerHTML=$("tpl-"+v).innerHTML;
    pk=$("packets"); bub=$("bubbles"); requestAnimationFrame(fitView);
    document.querySelectorAll(".vbtn").forEach(b=>b.classList.toggle("active",b.dataset.v===v));
    idx=0; paused=false; playBtn.textContent="\u23F8 Pause"; playBtn.classList.add("primary");
    restartLoop();
  }

  playBtn.addEventListener("click",()=>{ paused=!paused; playBtn.textContent=paused?"\u25B6 Play":"\u23F8 Pause"; playBtn.classList.toggle("primary",!paused); });
  $("nextBtn").addEventListener("click",()=>{ idx=(idx+1)%scen.length; paused=false; playBtn.textContent="\u23F8 Pause"; playBtn.classList.add("primary"); restartLoop(); });
  $("prevBtn").addEventListener("click",()=>{ idx=(idx-1+scen.length)%scen.length; paused=false; playBtn.textContent="\u23F8 Pause"; playBtn.classList.add("primary"); restartLoop(); });
  $("restartBtn").addEventListener("click",()=>{ idx=0; paused=false; playBtn.textContent="\u23F8 Pause"; playBtn.classList.add("primary"); restartLoop(); });
  document.querySelectorAll(".btn.sp").forEach(b=>b.addEventListener("click",()=>{ document.querySelectorAll(".btn.sp").forEach(x=>x.classList.remove("active")); b.classList.add("active"); speed=parseFloat(b.dataset.s); }));
  document.querySelectorAll(".vbtn").forEach(b=>b.addEventListener("click",()=>renderView(b.dataset.v)));

  // ===== Google-Maps-style pan & zoom =====
  // The SVG is positioned with a CSS transform (translate + scale). Wheel and
  // the +/- buttons zoom toward a focal point; drag pans; two-finger pinch
  // zooms and pans on touch. "Fit" recentres the whole diagram in view.
  let scale=1, tx=0, ty=0, fitScale=1;
  const ASPECT=1080/1690;

  function applyTransform(animate){
    const wf=$("wf"); if(!wf) return;
    wf.style.transition = animate ? "transform .18s ease-out" : "none";
    wf.style.transform = "translate("+tx+"px,"+ty+"px) scale("+scale+")";
    const zr=$("zoomReset");
    if(zr) zr.textContent = (Math.round(scale/fitScale*100)===100) ? "Fit" : Math.round(scale/fitScale*100)+"%";
  }
  function fitView(){
    const wf=$("wf"); if(!wf) return;
    const sw=stage.clientWidth, sh=stage.clientHeight;
    const baseW=sw, baseH=sw*ASPECT;            // size of #wf at scale 1 (width:100%)
    fitScale = Math.min(1, sh/baseH);           // shrink to fit height if needed
    scale = fitScale;
    tx = (sw - baseW*scale)/2;
    ty = (sh - baseH*scale)/2;
    applyTransform(true);
  }
  function clampScale(s){ return Math.min(fitScale*5, Math.max(fitScale*0.5, s)); }
  function zoomAt(px,py,factor,animate){
    const ns=clampScale(scale*factor); const k=ns/scale;
    tx = px - (px - tx)*k;   // keep the focal point stationary
    ty = py - (py - ty)*k;
    scale = ns; applyTransform(animate);
  }
  function center(){ return { x: stage.clientWidth/2, y: stage.clientHeight/2 }; }

  $("zoomIn").addEventListener("click",()=>{ const c=center(); zoomAt(c.x,c.y,1.3,true); });
  $("zoomOut").addEventListener("click",()=>{ const c=center(); zoomAt(c.x,c.y,1/1.3,true); });
  $("zoomReset").addEventListener("click",fitView);

  stage.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=stage.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:1/1.12, false);
  },{passive:false});

  // Pointer events unify mouse drag and touch pan/pinch.
  const ptrs=new Map();
  let pinchDist=0, pinchMid=null, panLast=null;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const midp=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

  stage.addEventListener("pointerdown",e=>{
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    stage.classList.add("grabbing");
    if(ptrs.size===1){ panLast={x:e.clientX,y:e.clientY}; }
    else if(ptrs.size===2){ const p=[...ptrs.values()]; pinchDist=dist(p[0],p[1]); pinchMid=midp(p[0],p[1]); panLast=null; }
  });
  stage.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=stage.getBoundingClientRect();
    if(ptrs.size>=2){
      const p=[...ptrs.values()]; const nd=dist(p[0],p[1]); const nm=midp(p[0],p[1]);
      if(pinchDist){ zoomAt(nm.x-r.left, nm.y-r.top, nd/pinchDist, false); }
      if(pinchMid){ tx += (nm.x-pinchMid.x); ty += (nm.y-pinchMid.y); applyTransform(false); }
      pinchDist=nd; pinchMid=nm;
    } else if(panLast){
      tx += (e.clientX-panLast.x); ty += (e.clientY-panLast.y);
      panLast={x:e.clientX,y:e.clientY}; applyTransform(false);
    }
  });
  function endPtr(e){
    ptrs.delete(e.pointerId);
    if(ptrs.size<2){ pinchDist=0; pinchMid=null; }
    if(ptrs.size===1){ const p=[...ptrs.values()][0]; panLast={x:p.x,y:p.y}; }
    if(ptrs.size===0){ panLast=null; stage.classList.remove("grabbing"); }
  }
  stage.addEventListener("pointerup",endPtr);
  stage.addEventListener("pointercancel",endPtr);

  let rT; window.addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(fitView,150); });

  renderView("agent");
})();
</script>
