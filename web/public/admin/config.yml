# Konfigurasi CMS admin smartagri (Sveltia CMS, kompatibel Decap).
# Admin membuka /admin → login GitHub → mengisi form → Publish →
# tersimpan sebagai commit → hosting otomatis rebuild & tayang.
#
# TODO sebelum bisa dipakai (lihat SETUP-ADMIN-CMS.md di root proyek):
#   1. Ganti `repo` dengan nama repo GitHub yang sebenarnya (owner/nama-repo).
#   2. Deploy sveltia-cms-auth (Cloudflare Worker gratis) lalu isi `base_url`.

backend:
  name: github
  repo: smartagriugm-sudo/smartagri-website
  branch: main
  base_url: https://sveltia-cms-smartagri-auth.smartagri-ugm.workers.dev

site_url: https://smartagri.id
logo_url: /brand/icon-color.svg

media_folder: web/public/brand/uploads
public_folder: /brand/uploads

# Setiap gambar yang di-upload lewat CMS otomatis dikonversi ke WebP
# (maks 2048px, kualitas 85) sebelum disimpan — menjaga repo tetap kecil
# dan halaman cepat dimuat. File lama bisa dikompres manual dengan
# `node scripts/optimize-uploads.mjs` di folder web/.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true

collections:
  - name: field-notes
    label: Field Notes
    label_singular: Field Note
    folder: web/src/content/notes
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{fields.date}}-{{slug}}"
    summary: "{{title}} — {{category}}, {{date}}"
    sortable_fields: [date, title, category]
    fields:
      - name: category
        label: Category
        widget: select
        default: News
        options:
          - News
          - Research
          - Knowledge
          - Events
          - Collaboration Research
          - Conference
          - Achievement
          - Field Activity
          - Guest Lecture
          - Information
          - Public Lecture
          - Publication
          - Student Exchange
          - Uncategorized
          - Visiting Research
          - Workshop Training
      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - name: title
        label: Title
        widget: string
      - name: author
        label: Author
        widget: string
        required: false
        hint: "Nama penulis, mis. Fahmi Arsyad — tampil di bawah judul artikel."
      - name: tags
        label: Tags
        widget: select
        multiple: true
        required: false
        hint: "Pilih satu atau beberapa tag topik (opsional) — tampil di akhir artikel."
        options:
          - Smart Farming
          - Precision Agriculture
          - IoT & Sensors
          - Drone & UAV
          - AI & Machine Learning
          - Remote Sensing
          - Irrigation
          - Greenhouse & Indoor Farming
          - Data Science
          - Sustainability
          - SDGs
          - Student Activity
          - International Collaboration
          - Industry Partnership
          - Community & Farmers
          - Award
          - UGM
          - INAGRITECH 2026
      - name: excerpt
        label: Excerpt
        widget: text
        hint: "Ringkasan 2–3 kalimat yang tampil di kartu artikel."
      - name: cover
        label: Cover image
        widget: image
        required: false
        hint: "Opsional — landscape ≥800px. Tanpa foto, kartu memakai gradien brand."
      - name: body
        label: Body
        widget: markdown
        required: false
        hint: >-
          Isi artikel lengkap. Sisipkan gambar lewat tombol image di posisi
          mana pun. Atur penempatan lewat teks alt gambar: "Keterangan|left"
          (rata kiri, teks mengalir di kanan), "Keterangan|right" (rata kanan),
          atau tanpa tambahan untuk lebar penuh. Galeri sejajar: tulis 2+
          gambar dalam SATU baris yang sama (mode markdown), contoh
          "![](/a.jpg) ![](/b.jpg) ![](/c.jpg)" — otomatis tampil
          berdampingan, maksimal 3 per baris lalu menyambung ke baris baru.

  - name: publications
    label: Publications
    label_singular: Publication
    folder: web/src/content/publications
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{fields.year}}-{{slug}}"
    summary: "{{year}} — {{title}}"
    sortable_fields: [year, title]
    fields:
      - name: year
        label: Year
        widget: string
        hint: "Contoh: 2026"
      - name: title
        label: Title
        widget: string
      - name: authors
        label: Authors
        widget: string
        hint: "Format: Nama B., Nama C., Nama D."
      - name: venue
        label: Journal / venue
        widget: string
      - name: link
        label: DOI / URL
        widget: string
        required: false
        hint: >-
          Contoh: https://doi.org/10.1016/... — tanggal terbit, volume,
          halaman, penerbit, dan jumlah sitasi diambil OTOMATIS dari DOI ini
          (via Crossref) di halaman detail publikasi.
      - name: abstract
        label: Abstract
        widget: text
        required: false
        hint: >-
          Abstrak/deskripsi publikasi — tampil di halaman detail. Disarankan
          diisi manual karena banyak penerbit tidak menyetor abstrak ke
          Crossref.
      - name: cover
        label: Cover image
        widget: image
        required: false
        hint: "Opsional — figure/gambar utama paper untuk halaman detail."
